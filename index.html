<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Momentum — Tracker de hábitos</title>
<meta name="theme-color" content="#080808"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Momentum"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
<style>
:root{--bg:#080808;--l1:#101012;--l2:#18181B;--gold:#F5C518;--lime:#D2F802;--mut:#A1A1AA;--dim:#52525B;--line:rgba(255,255,255,.08);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) radial-gradient(rgba(245,197,24,.05) 1px,transparent 0) 0 0/22px 22px;color:#fff;font:400 14px/20px 'Hanken Grotesk',system-ui,sans-serif;min-height:100dvh}
body::before{content:"";position:fixed;top:-120px;left:50%;width:380px;height:380px;transform:translateX(-50%);background:rgba(245,197,24,.1);filter:blur(110px);border-radius:50%;pointer-events:none;z-index:-1}
#app{max-width:480px;margin:auto;padding:1.25rem 1.25rem calc(7rem + env(safe-area-inset-bottom,0px))}
.scr{display:none;flex-direction:column;gap:1.25rem}.scr.on{display:flex;animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:22px;line-height:1;font-variation-settings:'FILL' 1}
.syne{font-family:Syne,sans-serif;letter-spacing:-.03em}.cap{font:700 11px/14px 'Space Grotesk';letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.mono{font-family:'Space Grotesk'}
h1{font:800 clamp(34px,10vw,46px)/.98 Syne;letter-spacing:-.03em;margin:.4rem 0;text-transform:uppercase;color:#FFE5A0}h1 span{color:#fff}
.card{background:var(--l1);border-radius:2rem;padding:1.4rem;border:1px solid var(--line);position:relative}.card.g{border-color:rgba(245,197,24,.3);box-shadow:0 16px 40px -10px rgba(245,197,24,.22)}
.row{display:flex;align-items:center;justify-content:space-between;gap:.75rem}.col{display:flex;flex-direction:column;gap:.75rem}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.btn{border-radius:9999px;padding:.9rem 1.4rem;font-weight:700;background:var(--gold);color:#080808;box-shadow:0 12px 32px -6px rgba(245,197,24,.25);transition:transform .15s}.btn:active{transform:scale(.97)}
.btn.l{background:var(--lime);box-shadow:0 12px 32px -6px rgba(210,248,2,.2)}.btn.gh{background:var(--l2);color:#fff;border:1px solid var(--line);box-shadow:none}.btn.w{width:100%}.btn.d{background:#3a1512;color:#ffb4ab;box-shadow:none}
.chip{border-radius:9999px;padding:.4rem .9rem;background:#141416;color:var(--mut);border:1px solid var(--line);font:700 11px 'Space Grotesk';letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}.chip.on{background:var(--gold);color:#080808}
.chips{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none}
input,select,textarea{background:var(--l1);border:1px solid var(--line);border-radius:1rem;padding:.75rem 1rem;width:100%;outline:0}input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px rgba(245,197,24,.4)}
.big{font:800 clamp(64px,20vw,92px)/.9 Syne;color:#FFE5A0;letter-spacing:-.04em}
.bar{height:12px;border-radius:9999px;background:#0e0e0e;border:1px solid var(--line);padding:2px}.bar i{display:block;height:100%;border-radius:9999px;background:linear-gradient(90deg,#D4AF37,var(--gold));transition:width .6s}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem;text-align:center}
.ring{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px solid #27272A;background:transparent;color:#080808;transition:transform .15s}
.ring.d{background:var(--gold);border-color:var(--gold);box-shadow:0 6px 16px -4px rgba(245,197,24,.4)}.ring.d.l{background:var(--lime);border-color:var(--lime)}.ring.p{border-color:rgba(245,197,24,.6)}.ring.m{color:var(--dim);font-size:14px}.ring.x{border:0;opacity:.25}.ring:active{transform:scale(.88)}
.ring .ms{font-size:18px}
.hab{background:var(--l1);border:1px solid var(--line);border-radius:1.6rem;padding:1rem;display:flex;flex-direction:column;gap:.8rem;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));display:none;gap:.4rem;padding:.45rem;border-radius:9999px;background:rgba(16,16,18,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);width:min(320px,calc(100% - 2.5rem));justify-content:space-around;z-index:20}.nav.on{display:flex;animation:in .5s}
.nav button{width:64px;height:48px;border-radius:9999px;color:#71717A;display:grid;place-items:center}.nav button.on{background:var(--gold);color:#080808}
.ov{position:fixed;inset:0;display:none;z-index:50;background:var(--bg);overflow:auto;padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom,0px))}.ov.on{display:block}
#sh{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(0,0,0,.7)}#sh.on{display:flex}#sh .card{width:100%;max-width:480px;margin:auto;border-radius:2rem 2rem 0 0;max-height:90dvh;overflow:auto;background:#141416;animation:in .25s}
.hero{height:360px;border-radius:2rem;position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(120% 90% at 0 0,rgba(245,197,24,.5),transparent 55%),#0a0a0b;border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.5) 1px,transparent 0) 0 0/5px 5px;mix-blend-mode:multiply}
.fig{font-size:150px;color:#FFE5A0;filter:drop-shadow(0 0 28px rgba(245,197,24,.7));animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both,sway .9s .2s ease-out 1;z-index:1}
@keyframes rise{from{transform:translateY(40px) scale(.7);opacity:0}}@keyframes sway{30%{transform:rotate(-8deg) scale(1.06)}65%{transform:rotate(5deg)}}
.badge{position:absolute;top:14px;right:14px;z-index:2;background:var(--gold);color:#080808;border-radius:1.2rem;padding:.4rem .8rem;font:800 20px Syne;display:flex;gap:.2rem;align-items:center;box-shadow:0 10px 28px -6px rgba(245,197,24,.5)}.badge .ms{font-size:20px}
.t{position:fixed;left:50%;bottom:6.5rem;transform:translateX(-50%);background:#fff;color:#080808;padding:.6rem 1.1rem;border-radius:9999px;font-weight:700;z-index:80;animation:in .25s}
.empty{text-align:center;color:var(--mut);padding:2rem 1rem}.note{font-size:12px;color:var(--mut);border-left:2px solid var(--gold);padding-left:.7rem}
.mc{position:relative;overflow:hidden;border-radius:2rem;padding:1.4rem;border:1px solid rgba(255,120,30,.3);background:radial-gradient(120% 90% at 0 0,rgba(255,200,40,.95),rgba(255,95,0,.45) 28%,transparent 58%),#1b1b1c;box-shadow:0 30px 60px -24px rgba(255,100,0,.45)}
.pill{background:#ff5a0f;color:#fff;border-radius:9999px;padding:.55rem 1.1rem;font-weight:700;display:inline-block}
.mch{position:relative;padding-top:112px;margin-top:.4rem}.tip{position:absolute;top:0;width:190px;padding:.7rem .9rem;border-radius:1.2rem;background:rgba(40,40,42,.65);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);z-index:3;font-size:13px;transition:left .3s}.tr{display:flex;justify-content:space-between;color:#c9c9cc}.tr b{color:#fff}
.mbs{display:flex;gap:.55rem;height:120px;border-bottom:1px solid rgba(255,255,255,.18)}.mb{flex:1;position:relative;display:flex;align-items:flex-end;padding:0}.mb i{display:block;width:100%;height:var(--h);border-radius:1.1rem 1.1rem .4rem .4rem;background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 0) 0 0/4px 4px,linear-gradient(#3b3b3d,#262628);transition:height .5s}.mb.on i{background:linear-gradient(#ff5a00,rgba(255,90,0,.12))}
.mb.on::after{content:"";position:absolute;bottom:0;left:50%;width:2px;height:var(--h);background:#fff;transform:translateX(-50%)}.dot{position:absolute;bottom:calc(var(--h) - 11px);left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#fff;color:#ff5a0f;display:grid;place-items:center;z-index:2}.dot .ms{font-size:15px}
.mls{display:flex;gap:.55rem;margin-top:.7rem;text-align:center;color:var(--mut);font-size:13px;text-transform:uppercase}.mls span{flex:1}.mls .sel{color:#ff6b5e}
.wh{height:144px;width:96px;overflow-y:auto;scroll-snap-type:y mandatory;padding:48px 0;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}.wh::-webkit-scrollbar{display:none}.wh div{height:48px;display:grid;place-items:center;scroll-snap-align:center;font:800 34px Syne}
.wband{position:absolute;left:0;right:0;top:48px;height:48px;border-radius:9999px;background:rgba(245,197,24,.08);border:1px solid rgba(245,197,24,.35);pointer-events:none}
.gb{height:16px;border-radius:9999px;background:#0b0b0c;border:1px solid var(--line);padding:2px}.gb i{display:block;height:100%;border-radius:9999px;position:relative;background:radial-gradient(rgba(0,0,0,.2) 1px,transparent 0) 0 0/4px 4px,linear-gradient(90deg,#6b5200,#D4AF37 45%,#FFE5A0);box-shadow:0 0 18px -2px rgba(245,197,24,.55);transition:width .7s}.gb i.f{background:radial-gradient(rgba(0,0,0,.2) 1px,transparent 0) 0 0/4px 4px,linear-gradient(90deg,#5a6c00,#b3d400 45%,#D2F802);box-shadow:0 0 18px -2px rgba(210,248,2,.5)}
.gb i::after,.bar i::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:35%;border-radius:9999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}.bar i{position:relative;box-shadow:0 0 14px -2px rgba(245,197,24,.5)}
.fgs{height:96%;width:auto;position:relative;z-index:1}.bign{position:absolute;left:16px;bottom:8px;z-index:2;display:flex;align-items:flex-end;gap:.5rem;pointer-events:none}.bign b{font:800 clamp(88px,26vw,120px)/.82 Syne;letter-spacing:-.05em;color:#FFE5A0}.bign small{font:700 11px/13px 'Space Grotesk';letter-spacing:.12em;color:var(--mut);padding-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app">
<section class="scr" id="s0"></section><section class="scr" id="s1"></section><section class="scr" id="s2"></section>
</div>
<nav class="nav" id="nav" aria-label="Navegación principal"><button data-a="go" data-s="0" aria-label="Inicio"><span class="ms">home</span></button><button data-a="go" data-s="1" aria-label="Semana"><span class="ms">grid_view</span></button><button data-a="go" data-s="2" aria-label="Gestión y Pomodoro"><span class="ms">tune</span></button></nav>
<div class="ov" id="det"></div><div class="ov" id="rev"></div><div class="ov" id="foc"></div><div id="sh"></div>
<script>
const $=s=>document.querySelector(s),K='momentum-v1',DL=['L','M','X','J','V','S','D'],MO=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ICONS=['menu_book','fitness_center','self_improvement','water_drop','bedtime','terminal','directions_run','edit','restaurant','bolt'];
const HEXP=10;
let S,scr=0,wo=0,sk='g',lp=0,lpF=0,cf=null,wl=null,mi=6,wt;
function def(){return{habits:[],logs:{},ledger:[],pomo:{dur:25,penExp:20,active:null},unlocked:false}}
function load(){try{const v=JSON.parse(localStorage.getItem(K));return v&&v.habits?v:def()}catch(e){return def()}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('No se pudo guardar en este navegador')}}
S=load();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>add(d,-((d.getDay()+6)%7));
const wd=d=>(d.getDay()+6)%7;
function sched(h,d){const k=dk(d);if(S.rest&&S.rest[k]&&!(S.logs[k]&&S.logs[k][h.id]))return false;let r=null;for(const s of h.hist)if(s.from<=k)r=s;return !!r&&(r.freq==='daily'||r.days.includes(wd(d)))}
const done=(h,d)=>!!(S.logs[dk(d)]||{})[h.id];
function streak(list,minDate){// list: hábitos que deben cumplirse; racha = días programados consecutivos
 let d=today(),n=0;const ok=x=>{const s=list.filter(h=>sched(h,x));return s.length?s.every(h=>done(h,x)):null};
 if(ok(d)!==true)d=add(d,-1);
 for(let i=0;i<800;i++,d=add(d,-1)){const r=ok(d);if(r===null){if(dk(d)<minDate)break;continue}if(!r)break;n++}return n}
const hStreak=h=>streak([h],h.hist[0].from);
const gStreak=()=>S.habits.length?streak(S.habits,S.habits.map(h=>h.hist[0].from).sort()[0]):0;
const tot=k=>S.ledger.reduce((a,x)=>a+(x[k]||0),0);
const cum=L=>50*L*(L-1),lvl=e=>Math.floor((1+Math.sqrt(1+Math.max(0,e)/12.5))/2);
const fm=n=>(n<0?'−':'')+'$'+Math.abs(n).toFixed(2).replace(/\.00$/,'').replace('.',',');
function log(key,exp,label){S.ledger.push({id:Date.now()+Math.random(),ts:Date.now(),key,exp,label})}
function toast(m){document.querySelectorAll('.t').forEach(x=>x.remove());const t=document.createElement('div');t.className='t';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function toggle(id,ds){const h=S.habits.find(x=>x.id===id);if(!h)return;const d=new Date(ds+'T00:00');if(d>today())return toast('No podés marcar días futuros');if(!sched(h,d))return S.rest&&S.rest[ds]?toast('Ese día es de descanso'):0;
 S.logs[ds]=S.logs[ds]||{};
 if(S.logs[ds][id]){delete S.logs[ds][id];log('h:'+id+':'+ds,-HEXP,'Revertido: '+h.name)}else{S.logs[ds][id]=1;log('h:'+id+':'+ds,HEXP,h.name);if(navigator.vibrate)navigator.vibrate(15)}chkGoals();
 save();render()}

/* ---------- PANTALLA 0 ---------- */
function msg(){if(S.rest&&S.rest[dk(today())])return['DESCANSÁ.','HOY ES DE RECUPERACIÓN.','Tu racha está a salvo. Volvé mañana con la cabeza fresca.'];const ds=[1,2,3].map(i=>add(today(),-i));let s=0,c=0;S.habits.forEach(h=>ds.forEach(d=>{if(sched(h,d)){s++;if(done(h,d))c++}}));
 const pend=S.habits.filter(h=>sched(h,today())&&!done(h,today())).length;
 const tail=pend?`Hoy te quedan ${pend} por cumplir.`:'Hoy está todo cumplido.';
 if(!s)return['EMPEZÁ.','HOY SE CONSTRUYE.','Cada día cumplido suma. '+tail];
 const r=c/s;
 if(r>=.8)return['IMPARABLE.','HOY NO SE NEGOCIA.','Mantené el estándar. '+tail];
 if(r>=.5)return['TE ESTÁS AFLOJANDO.','VOLVÉ AL ESTÁNDAR.',`Cumpliste ${c} de ${s} en los últimos 3 días. `+tail];
 return['¿ESTO ES TODO?','LO QUE PROMETISTE NO SE CUMPLE SOLO.',`Solo ${c} de ${s} en los últimos 3 días. `+tail]}
function week(off){const m=add(mon(today()),off*7);return Array.from({length:7},(_,i)=>add(m,i))}
function home(){const hs=S.habits;if(!hs.length)return`<div class="row"><b class="syne" style="font-size:20px;color:#FFE5A0">⚡ MOMENTUM</b></div><h1>SIN HÁBITOS.<br><span>SIN PROGRESO.</span></h1><div class="empty card">Todavía no definiste ningún hábito. Creá el primero y empezá a sumar EXP.</div><button class="btn w" data-a="newH">Crear mi primer hábito</button>`;
 const [a,b,p]=msg(),W=week(0),T=today();let tt=0,dn=0;const dots=W.map((d,i)=>{const s=hs.filter(h=>sched(h,d)),c=s.filter(h=>done(h,d)).length;tt+=s.length;dn+=c;const col=!s.length||d>T&&!c?'#27272A':c===s.length?'var(--gold)':c?'var(--lime)':d<T?'#3a1512':'#27272A';return`<div><div class="cap" style="${d.getTime()===T.getTime()?'color:#fff':''}">${DL[i]}</div><span style="display:block;width:8px;height:8px;border-radius:50%;background:${col};margin:5px auto 0"></span></div>`}).join('');
 const pct=tt?Math.round(dn/tt*100):0,e=Math.max(0,tot('exp')),L=lvl(e),lo=cum(L),hi=cum(L+1);
 const chips=`<button class="chip ${sk==='g'?'on':''}" data-a="sk" data-id="g">General</button>`+hs.map(h=>`<button class="chip ${sk===h.id?'on':''}" data-a="sk" data-id="${h.id}">${esc(h.name)}</button>`).join('');
 const sh=hs.find(h=>h.id===sk),sn=sh?hStreak(sh):gStreak(),rc=Math.max(sn,sh?best([sh],sh.hist[0].from):best(hs,hs.map(h=>h.hist[0].from).sort()[0]));
 return`<div class="row"><b class="syne" style="font-size:20px;color:#FFE5A0">⚡ MOMENTUM</b><span class="chip on" style="background:var(--l2);color:var(--lime)">Nv ${L}</span></div>
 <div><span class="cap">Protocolo diario</span><h1>${a}<br><span>${b}</span></h1><p style="color:#d1c5ac;margin:.3rem 0 0">${p}</p></div>
 ${revCard()}
 <div class="card"><span class="cap">Rendimiento semanal</span>
 <div class="row" style="gap:1rem;margin-top:.8rem;flex-wrap:wrap;justify-content:center"><div style="position:relative;width:150px;height:150px"><svg viewBox="0 0 120 120" style="transform:rotate(-90deg)"><circle cx="60" cy="60" r="48" fill="none" stroke="#18181B" stroke-width="9"/><circle cx="60" cy="60" r="48" fill="none" stroke="#F5C518" stroke-width="9" stroke-linecap="round" stroke-dasharray="301.59" stroke-dashoffset="${(301.59*(1-pct/100)).toFixed(1)}" style="transition:stroke-dashoffset .8s"/></svg><div style="position:absolute;inset:0;display:grid;place-content:center;text-align:center"><span class="syne" style="font-size:38px;font-weight:800;color:#FFE5A0">${pct}<small style="font-size:18px">%</small></span><span class="cap">cumplido</span></div></div>
 <div class="col" style="flex:1;min-width:170px"><div class="days" style="background:var(--l2);border-radius:9999px;padding:.6rem .7rem">${dots}</div><div class="row"><div class="card" style="padding:.7rem 1rem;border-radius:1rem;flex:1;background:var(--l2)"><div class="cap">Hechos</div><b class="syne" style="font-size:22px">${dn}<small style="color:var(--mut)">/${tt}</small></b></div><div class="card" style="padding:.7rem 1rem;border-radius:1rem;flex:1;background:var(--l2)"><div class="cap">Pendientes</div><b class="syne" style="font-size:22px;color:#FFE5A0">${tt-dn}</b></div></div></div></div></div>
 <div class="card g"><div class="row"><span class="cap" style="color:var(--gold)">🔥 Racha</span></div><div class="chips" style="margin:.8rem 0">${chips}</div><div class="row" style="justify-content:flex-start;align-items:baseline;gap:.8rem"><span class="big">${sn}</span><b class="syne" style="font-size:20px;text-transform:uppercase">días<br>seguidos</b></div><div class="row" style="margin-top:.7rem"><span class="chip" style="background:var(--l2);color:var(--gold)">🏆 Récord: ${rc} ${rc===1?'día':'días'}</span><span style="color:var(--mut);font-size:12px;text-align:right">${sh?'Solo días programados':'Todos los hábitos del día'}</span></div></div>
 <div class="card"><span class="cap">Rango disciplinario</span><div class="syne" style="font-size:26px;font-weight:700;margin:.2rem 0 .8rem">NIVEL ${L}</div><div class="bar"><i style="width:${((e-lo)/(hi-lo)*100).toFixed(1)}%"></i></div><div class="row mono" style="margin-top:.5rem"><b style="color:var(--gold)">${e} EXP</b><span style="color:var(--mut)">${hi-e} EXP para nivel ${L+1}</span></div></div>
 ${discCard()}${goalCard()}
 ${monthCard()}
 <button class="btn gh w" data-a="shareS">Compartir mi semana</button>
 <button class="btn w" data-a="unlock">Ver mi semana ↓</button>`}

function best(list,from){let b=0,c=0,T=today();for(let d=new Date(from+'T00:00');d<=T;d=add(d,1)){const s=list.filter(h=>sched(h,d));if(!s.length)continue;if(s.every(h=>done(h,d))){c++;b=Math.max(b,c)}else if(d<T)c=0}return b}
